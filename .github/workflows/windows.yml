name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise the Windows app
        shell: pwsh
        run: ./test.ps1 -Preview "$PWD/build/cuidado.png"
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-system-craft-windows
          path: |
            build/v0.4.0/Advanced System Craft.exe
            build/cuidado.png
